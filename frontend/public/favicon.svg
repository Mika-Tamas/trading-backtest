<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <!-- Sharp backtester bg -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Flat, global left-to-right gradient sweep -->
    <linearGradient id="fractalSweep" gradientUnits="userSpaceOnUse" x1="3.5" y1="0" x2="29" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="38%" stop-color="#2dd4bf" />
      <stop offset="72%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Solid rounded Container -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#1e293b" stroke-width="1" />

  <!-- High-contrast recursive Fractal branches (Strictly level 0 to level 4) -->
  <g fill="none" stroke="url(#fractalSweep)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Level 0: Trunk -->
    <path d="M5 27 L11 21" stroke-width="2.3" />

    <!-- Level 1: Primary Splits -->
    <path d="M11 21 L9 14.5" stroke-width="1.8" />
    <path d="M11 21 L18 16.5" stroke-width="2.0" />
    <path d="M11 21 L17.5 23" stroke-width="1.7" />

    <!-- Level 2: Secondary Splits -->
    <path d="M9 14.5 L5.5 12.5 M9 14.5 L10 9.5" stroke-width="1.35" />
    <path d="M18 16.5 L15 11 M18 16.5 L23.5 12.5" stroke-width="1.45" />
    <path d="M17.5 23 L16 27 M17.5 23 L22.5 21.5" stroke-width="1.3" />

    <!-- Level 3: Tertiary splits -->
    <path d="M5.5 12.5 L3.5 10.5 M5.5 12.5 L6.5 9" stroke-width="1.0" />
    <path d="M10 9.5 L8 6.5 M10 9.5 L12.5 7" stroke-width="1.0" />
    <path d="M15 11 L12.5 8.5 M15 11 L16.5 7" stroke-width="1.0" />
    <path d="M23.5 12.5 L21 8 M23.5 12.5 L27 10" stroke-width="1.1" />
    <path d="M16 27 L14 28.5 M16 27 L18 28.5" stroke-width="0.9" />
    <path d="M22.5 21.5 L21.5 25.5 M22.5 21.5 L26.5 20.5" stroke-width="1.0" />

    <!-- Level 4: Fine outermost branches -->
    <path d="M8 6.5 L6.5 4.5 M8 6.5 L9.5 4.5" stroke-width="0.75" />
    <path d="M16.5 7 L15 4.5 M16.5 7 L18.5 5" stroke-width="0.75" />
    <path d="M21 8 L19.5 5.5 M21 8 L22.5 5" stroke-width="0.75" />
    <path d="M27 10 L25.5 6.5 M27 10 L29 7.5" stroke-width="0.8" />
    <path d="M26.5 20.5 L25.5 17.5 M26.5 20.5 L29 19" stroke-width="0.75" />
    <path d="M21.5 25.5 L20 27.5 M21.5 25.5 L23.5 27.5" stroke-width="0.75" />
  </g>

  <!-- Joint and Outer leaf nodes (Strictly Solid colors) -->
  <g fill="url(#fractalSweep)">
    <!-- Major intersections -->
    <circle cx="11" cy="21" r="1.25" />
    <circle cx="18" cy="16.5" r="1.15" />
    <circle cx="23.5" cy="12.5" r="1.05" />

    <!-- Boundary Endpoints -->
    <circle cx="3.5" cy="10.5" r="0.85" />
    <circle cx="6.5" cy="9" r="0.8" />
    <circle cx="6.5" cy="4.5" r="0.8" />
    <circle cx="9.5" cy="4.5" r="0.8" />
    <circle cx="12.5" cy="7" r="0.8" />
    <circle cx="12.5" cy="8.5" r="0.75" />
    <circle cx="15" cy="4.5" r="0.8" />
    <circle cx="18.5" cy="5" r="0.8" />
    <circle cx="19.5" cy="5.5" r="0.8" />
    <circle cx="22.5" cy="5" r="0.85" />
    <circle cx="25.5" cy="6.5" r="0.85" />
    <circle cx="29" cy="7.5" r="0.95" />
    <circle cx="25.5" cy="17.5" r="0.8" />
    <circle cx="29" cy="19" r="0.85" />
    <circle cx="20" cy="27.5" r="0.75" />
    <circle cx="23.5" cy="27.5" r="0.8" />
  </g>
</svg>